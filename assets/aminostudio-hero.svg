      <path d="M 14 75 H 45 L 61 35 L 78 86 L 93 52 H 110" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="75" r="5" fill="#53DAE5"/><circle cx="110" cy="52" r="5" fill="#A6FF92"/>
    </g>
    <text x="1025" y="282" fill="#8BBDBE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.2">SHIP / TEST / REVIEW</text>
